<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labbaik: The Sacred Journey (Simulasi Umrah 2D)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #111; color: #fff; text-align: center; overflow: hidden; }
        h1 { color: #d4af37; margin-top: 10px; font-size: 24px; }
        p.sub { color: #aaa; font-size: 14px; margin-bottom: 10px; }
        
        #game-container { position: relative; width: 1000px; height: 600px; margin: 0 auto; border: 3px solid #d4af37; border-radius: 8px; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        canvas { background-color: #e6d7b8; display: block; border-radius: 5px; }
        
        /* Modal & UI Elements */
        .modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                 background: #222; border: 2px solid #d4af37; padding: 20px; border-radius: 10px; width: 420px; z-index: 100; box-shadow: 0 0 25px rgba(0,0,0,0.9); }
        .modal h2 { color: #d4af37; margin-bottom: 10px; font-size: 20px; }
        .modal p { color: #ddd; font-size: 14px; margin-bottom: 15px; line-height: 1.5; text-align: left; }
        .btn { background: #d4af37; color: #000; border: none; padding: 10px 18px; font-weight: bold; cursor: pointer; border-radius: 5px; margin: 5px; transition: 0.2s; }
        .btn:hover { background: #f3cf65; transform: scale(1.03); }
        
        #hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.75); padding: 12px; border-radius: 6px; text-align: left; font-size: 13px; color: #d4af37; border: 1px solid rgba(212, 175, 55, 0.4); pointer-events: none; }
        #hud div { margin-bottom: 4px; }
        #action-prompt { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: none; gap: 10px; }
    </style>

    <!-- Firebase Realtime Database SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <h1>Labbaik: The Sacred Journey</h1>
    <p class="sub">Gunakan kekunci <b>W, A, S, D</b> atau <b>Anak Panah</b> untuk bergerak ke checkpoint.</p>

    <div id="game-container">
        <canvas id="gameCanvas" width="1000" height="600"></canvas>
        
        <div id="hud">
            <div><b>ID Pemain:</b> <span id="player-id">Menyambung...</span></div>
            <div><b>Pemain Aktif:</b> <span id="player-count">1</span>/30</div>
            <div><b>Checkpoint Semasa:</b> <span id="current-cp">Tiada</span></div>
            <div><b>Pusingan Tawaf:</b> <span id="tawaf-count">0</span>/7</div>
        </div>

        <div id="action-prompt">
            <button class="btn" onclick="openInfoModal()">Info Checkpoint</button>
            <button class="btn" onclick="triggerSimulation()">Mula Simulasi</button>
        </div>

        <!-- Modal Info -->
        <div id="infoModal" class="modal">
            <h2 id="modal-title">Info Checkpoint</h2>
            <p id="modal-desc">Maklumat berkaitan checkpoint...</p>
            <button class="btn" onclick="closeModal('infoModal')">Tutup</button>
        </div>

        <!-- Modal Kuiz Safwa Tower -->
        <div id="quizModal" class="modal">
            <h2>Kuiz Safwa Tower</h2>
            <p id="quiz-question">Soalan Kuiz...</p>
            <div id="quiz-options"></div>
        </div>
    </div>

    <script>
        // 1. Tetapan Demo Firebase (Gunakan pengkalan data awam terbuka)
        const firebaseConfig = {
            databaseURL: "https://labbaik-umrah-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        
        // Semak/Inisialisasi Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        
        // Jana ID unik pemain
        const playerId = "p_" + Math.random().toString(36).substr(2, 6);
        document.getElementById('player-id').innerText = playerId;

        const playerRef = db.ref('players/' + playerId);
        const playersRef = db.ref('players');

        // Data Checkpoint Umrah
        const checkpoints = [
            { id: 'miqat', name: "1. Miqat", x: 100, y: 500, radius: 45, color: "#8e44ad", info: "Miqat ialah sempadan tempat atau masa yang ditetapkan untuk berniat ihram Umrah." },
            { id: 'tawaf', name: "2. Tawaf (Kaabah)", x: 350, y: 300, radius: 95, color: "#2c3e50", info: "Mengelilingi Kaabah sebanyak 7 pusingan mengikut lawan jam bermula dari Hajarul Aswad." },
            { id: 'sai', name: "3. Sa'i (Safa & Marwah)", x: 700, y: 300, radius: 55, color: "#d35400", info: "Berjalan ulang-alik sebanyak 7 kali antara Bukit Safa dan Bukit Marwah." },
            { id: 'tahallul', name: "4. Tahallul", x: 850, y: 150, radius: 45, color: "#27ae60", info: "Bercukur atau menggunting sekurang-kurangnya 3 helai rambut sebagai penutup ihram." },
            { id: 'safwa', name: "5. Safwa Tower", x: 850, y: 500, radius: 55, color: "#f39c12", info: "Lokasi terakhir untuk menduduki kuiz kefahaman Umrah bersama pemain lain." }
        ];

        let localPlayer = {
            x: 100 + Math.random() * 40,
            y: 520 + Math.random() * 30,
            speed: 4,
            gender: Math.random() > 0.5 ? 'male' : 'female',
            tawafCount: 0
        };

        let remotePlayers = {};
        let keys = {};
        let activeCheckpoint = null;

        // Daftar Pemain ke Firebase & Padam Bila Keluar
        playerRef.set({
            x: localPlayer.x,
            y: localPlayer.y,
            gender: localPlayer.gender,
            updatedAt: Date.now()
        });
        playerRef.onDisconnect().remove();

        // Kemaskini Lokasi Pemain Lain secara Real-time
        playersRef.on('value', (snapshot) => {
            const data = snapshot.val() || {};
            remotePlayers = {};
            let count = 0;

            for (let id in data) {
                count++;
                if (id !== playerId) {
                    remotePlayers[id] = data[id];
                }
            }
            document.getElementById('player-count').innerText = count;
        });

        // Kawalan Papan Kekunci
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function update() {
            let moved = false;
            if (keys['w'] || keys['W'] || keys['ArrowUp']) { localPlayer.y -= localPlayer.speed; moved = true; }
            if (keys['s'] || keys['S'] || keys['ArrowDown']) { localPlayer.y += localPlayer.speed; moved = true; }
            if (keys['a'] || keys['A'] || keys['ArrowLeft']) { localPlayer.x -= localPlayer.speed; moved = true; }
            if (keys['d'] || keys['D'] || keys['ArrowRight']) { localPlayer.x += localPlayer.speed; moved = true; }

            // Hadkan Pergerakan Dalam Peta
            localPlayer.x = Math.max(15, Math.min(canvas.width - 15, localPlayer.x));
            localPlayer.y = Math.max(15, Math.min(canvas.height - 15, localPlayer.y));

            // Hantar Lokasi Baru ke Firebase
            if (moved) {
                playerRef.update({
                    x: localPlayer.x,
                    y: localPlayer.y,
                    updatedAt: Date.now()
                });
            }

            checkCheckpoints();
        }

        function checkCheckpoints() {
            activeCheckpoint = null;
            for (let cp of checkpoints) {
                let dist = Math.hypot(localPlayer.x - cp.x, localPlayer.y - cp.y);
                if (dist < cp.radius) {
                    activeCheckpoint = cp;
                    break;
                }
            }

            const prompt = document.getElementById('action-prompt');
            if (activeCheckpoint) {
                prompt.style.display = 'flex';
                document.getElementById('current-cp').innerText = activeCheckpoint.name;
            } else {
                prompt.style.display = 'none';
                document.getElementById('current-cp').innerText = "Tiada";
            }
        }

        function drawAvatar(x, y, gender, isLocal = false) {
            // Aura Pemain
            ctx.beginPath();
            ctx.arc(x, y, 13, 0, Math.PI * 2);
            ctx.fillStyle = isLocal ? "#00ffcc" : "rgba(255,255,255,0.3)";
            ctx.fill();

            // Pakaian Avatar (Ihram Putih / Jubah Telekung)
            ctx.beginPath();
            ctx.arc(x, y, 10, 0, Math.PI * 2);
            ctx.fillStyle = gender === 'male' ? '#ffffff' : '#222222';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#000';
            ctx.stroke();

            // Kepala
            ctx.beginPath();
            ctx.arc(x, y - 2, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffcc99';
            ctx.fill();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Lukis Checkpoints
            checkpoints.forEach(cp => {
                ctx.beginPath();
                ctx.arc(cp.x, cp.y, cp.radius, 0, Math.PI * 2);
                ctx.fillStyle = cp.color + "22";
                ctx.fill();
                ctx.strokeStyle = cp.color;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = "#111";
                ctx.font = "bold 12px Arial";
                ctx.fillText(cp.name, cp.x - 35, cp.y - cp.radius - 8);
            });

            // Model Kaabah 3D Ringkas
            ctx.fillStyle = "#000000";
            ctx.fillRect(325, 275, 50, 50);
            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 3;
            ctx.strokeRect(325, 275, 50, 50);

            // Lukis Pemain-Pemain Lain
            for (let id in remotePlayers) {
                let p = remotePlayers[id];
                drawAvatar(p.x, p.y, p.gender, false);
            }

            // Lukis Pemain Sendiri
            drawAvatar(localPlayer.x, localPlayer.y, localPlayer.gender, true);
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Fungsi Modal UI
        function openInfoModal() {
            if (!activeCheckpoint) return;
            document.getElementById('modal-title').innerText = activeCheckpoint.name;
            document.getElementById('modal-desc').innerText = activeCheckpoint.info;
            document.getElementById('infoModal').style.display = 'block';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function triggerSimulation() {
            if (!activeCheckpoint) return;

            if (activeCheckpoint.id === 'tawaf') {
                if (localPlayer.tawafCount < 7) {
                    localPlayer.tawafCount++;
                    document.getElementById('tawaf-count').innerText = localPlayer.tawafCount;
                    alert(`Simulasi Tawaf: Pusingan ke-${localPlayer.tawafCount} selesai!`);
                } else {
                    alert("Selesai 7 pusingan Tawaf! Sila teruskan ke Sa'i.");
                }
            } else if (activeCheckpoint.id === 'safwa') {
                startQuiz();
            } else {
                alert(`Simulasi untuk ${activeCheckpoint.name} dimulakan!`);
            }
        }

        // Soalan Kuiz Safwa Tower
        const quizQuestions = [
            { q: "Berapakah pusingan Tawaf yang wajib dilakukan?", a: ["5 Pusingan", "7 Pusingan", "3 Pusingan"], correct: 1 },
            { q: "Sa'i bermula dari bukit apa dan berakhir di bukit apa?", a: ["Safa ke Marwah", "Marwah ke Safa", "Mina ke Arafah"], correct: 0 },
            { q: "Apakah maksud Tahallul dalam ibadah Umrah?", a: ["Niat Umrah", "Bercukur/Menggunting rambut", "Berlari kecil"], correct: 1 }
        ];
        let currentQ = 0;
        let score = 0;

        function startQuiz() {
            currentQ = 0;
            score = 0;
            showQuestion();
            document.getElementById('quizModal').style.display = 'block';
        }

        function showQuestion() {
            let q = quizQuestions[currentQ];
            document.getElementById('quiz-question').innerText = (currentQ + 1) + ". " + q.q;
            let optionsDiv = document.getElementById('quiz-options');
            optionsDiv.innerHTML = '';

            q.a.forEach((opt, idx) => {
                let btn = document.createElement('button');
                btn.className = 'btn';
                btn.style.width = '100%';
                btn.style.margin = '5px 0';
                btn.innerText = opt;
                btn.onclick = () => answerQuiz(idx);
                optionsDiv.appendChild(btn);
            });
        }

        function answerQuiz(idx) {
            if (idx === quizQuestions[currentQ].correct) score += 33.3;
            currentQ++;

            if (currentQ < quizQuestions.length) {
                showQuestion();
            } else {
                alert(`Kuiz Tamat! Skor akhir anda: ${Math.round(score)}/100`);
                closeModal('quizModal');
            }
        }

        // Mula Permainan
        gameLoop();
    </script>
</body>
</html>
